<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atlas Céleste — Observatoire Astronomique</title>

  <link rel="icon" type="image/jpeg" sizes="512x512" href="./icon-512.jpeg">
  <link rel="apple-touch-icon" href="./icon-512.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #020617;
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* BARRE DE NAVIGATION MAÎTRESSE UNIQUE */
    #master-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      z-index: 1000;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2rem;
    }

    .bar-group-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-home:hover {
      color: #ffd166;
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.15);
      transform: scale(1.05);
    }

    .btn-nav-back {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: none; /* Visible seulement quand on quitte l'accueil */
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-nav-back:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    #nav-title {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      pointer-events: none;
    }

    .btn-fs {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-fs:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    /* CONTENEUR DES VUES */
    #views-container {
      position: absolute;
      top: 52px;
      left: 0;
      width: 100%;
      height: calc(100% - 52px);
      overflow: hidden;
    }

    .app-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      overflow-y: auto;
      background: #020617;
    }

    .app-view.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- BARRE MAÎTRESSE UNIQUE -->
  <header id="master-bar">
    <div class="bar-group-left">
      <a href="https://renoultdavid.github.io/accueil/" class="btn-home" title="Accueil général du site">🏠</a>
      <button id="btn-back" class="btn-nav-back" onclick="navigateBack()">← Retour</button>
    </div>

    <div id="nav-title">Atlas Céleste</div>

    <div>
      <button class="btn-fs" onclick="toggleFullScreen()" title="Plein écran">⛶ Plein écran</button>
    </div>
  </header>

  <!-- LES ÉCRANS DU SITE -->
  <main id="views-container">

    <!-- VUE 1 : PORTAIL GÉNÉRAL -->
    <section id="view-portal" class="app-view active">
      <div style="padding: 3rem; text-align: center;">
        <h1 style="font-family:'Cinzel', serif; font-size:2rem; margin-bottom:1rem;">ATLAS CÉLESTE</h1>
        <p style="color:#94a3b8; margin-bottom:2rem;">Portail d'exploration astronomique</p>
        <button onclick="goToView('systeme-solaire')" style="padding:12px 24px; border-radius:30px; background:#38bdf8; color:#020617; font-weight:700; border:none; cursor:pointer;">
          Explorer le Système Solaire →
        </button>
      </div>
    </section>

    <!-- VUE 2 : SYSTÈME SOLAIRE -->
    <section id="view-systeme-solaire" class="app-view">
      <div style="padding: 3rem; text-align: center;">
        <h1 style="font-family:'Cinzel', serif; font-size:2rem; margin-bottom:1rem; color:#ffd166;">LE SYSTÈME SOLAIRE</h1>
        <p style="color:#94a3b8; margin-bottom:2rem;">Hub d'exploration planétaire</p>
        <button onclick="goToView('astre-mercure')" style="padding:10px 20px; border-radius:20px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); cursor:pointer;">
          Voir la fiche de Mercure →
        </button>
      </div>
    </section>

    <!-- VUE 3 : EXEMPLE FICHE ASTRE -->
    <section id="view-astre-mercure" class="app-view">
      <div style="padding: 3rem; text-align: center;">
        <h1 style="font-family:'Cinzel', serif; font-size:2rem; margin-bottom:1rem; color:#38bdf8;">MERCURE</h1>
        <p style="color:#94a3b8;">La planète de fer et de cratères</p>
      </div>
    </section>

  </main>

  <script>
    /* HISTORIQUE DE NAVIGATION INTERNE */
    let navigationStack = ['portal'];

    function goToView(viewId) {
      document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));

      const target = document.getElementById('view-' + viewId);
      if (target) {
        target.classList.add('active');
        navigationStack.push(viewId);
        updateMasterBar(viewId);
      }
    }

    function navigateBack() {
      if (navigationStack.length > 1) {
        navigationStack.pop(); // Retire la vue actuelle
        const previousView = navigationStack[navigationStack.length - 1];

        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + previousView).classList.add('active');
        updateMasterBar(previousView);
      }
    }

    function updateMasterBar(viewId) {
      const backBtn = document.getElementById('btn-back');
      const title = document.getElementById('nav-title');

      if (viewId === 'portal') {
        backBtn.style.display = 'none';
        title.innerText = 'Atlas Céleste';
      } else if (viewId === 'systeme-solaire') {
        backBtn.style.display = 'inline-flex';
        backBtn.innerText = '← Atlas Céleste';
        title.innerText = 'Système Solaire';
      } else if (viewId.startsWith('astre-')) {
        backBtn.style.display = 'inline-flex';
        backBtn.innerText = '← Système Solaire';
        title.innerText = 'Exploration Planétaire';
      }
    }

    /* PLEIN ÉCRAN PERMANENT */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Plein écran non supporté ou bloqué :", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* TOUCHE ÉCHAP POUR RECULER D'UN NIVEAU */
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && navigationStack.length > 1) {
        navigateBack();
      }
    });
  </script>
</body>
</html>
