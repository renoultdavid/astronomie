<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portail Céleste - Astronomie</title>

  <!-- Icône de l'application -->
  <link rel="icon" type="image/jpeg" sizes="512x512" href="./icon-512.jpeg">
  <link rel="apple-touch-icon" href="./icon-512.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      font-family: 'Montserrat', sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Le portail garde ses proportions 16/9 et se centre sans jamais déborder */
    .portal-container {
      position: relative;
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100dvh * (16 / 9)));
      height: min(100dvh, calc(100vw * (9 / 16)));
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* L'image remplit son cadre sans la moindre déformation */
    .space-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: filter 0.6s ease;
    }

    body.drawer-open .space-canvas {
      filter: brightness(0.45) blur(4px);
    }

    .cosmic-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 0) 0%, rgba(2, 6, 23, 0.45) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* EN-TÊTE */
    .header-bar {
      position: absolute;
      top: clamp(16px, 3vh, 32px);
      left: clamp(16px, 3vw, 36px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .header-sub {
      font-size: clamp(0.6rem, 1vw, 0.75rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.75);
      margin-top: 0.3rem;
    }

    /* BALISES ET POINTS CLIQUABLES */
    .hotspot {
      position: absolute;
      z-index: 20;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hotspot.reverse {
      flex-direction: row-reverse;
    }

    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 30;
    }

    .pulse-anchor {
      position: relative;
      width: clamp(18px, 1.8vw, 24px);
      height: clamp(18px, 1.8vw, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .core-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff;
      position: relative;
      z-index: 2;
    }

    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: breathe 3.6s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    .pulse-ring-1 {
      width: 100%;
      height: 100%;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
    }

    .pulse-ring-2 {
      width: 165%;
      height: 165%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation-delay: 0.7s;
    }

    .label-pill {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.58rem, 0.85vw, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: clamp(5px, 0.6vw, 8px) clamp(12px, 1.2vw, 18px);
      border-radius: 30px;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.95);
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65), 0 0 15px rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
      animation: pill-glow 3.6s infinite ease-in-out;
    }

    .hotspot:hover .label-pill {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
      color: #ffffff;
    }

    /* Thèmes de couleur */
    .theme-solar .core-dot { background: #ffd166; box-shadow: 0 0 10px #ffd166; }
    .theme-solar .pulse-ring { border-color: rgba(255, 209, 102, 0.85); }
    .theme-solar .label-pill { border-color: rgba(255, 209, 102, 0.4); }

    .theme-nebula .core-dot { background: #f43f5e; box-shadow: 0 0 10px #f43f5e; }
    .theme-nebula .pulse-ring { border-color: rgba(244, 63, 94, 0.85); }
    .theme-nebula .label-pill { border-color: rgba(244, 63, 94, 0.4); }

    .theme-open .core-dot { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
    .theme-open .pulse-ring { border-color: rgba(56, 189, 248, 0.85); }
    .theme-open .label-pill { border-color: rgba(56, 189, 248, 0.4); }

    .theme-globular .core-dot { background: #a78bfa; box-shadow: 0 0 10px #a78bfa; }
    .theme-globular .pulse-ring { border-color: rgba(167, 139, 250, 0.85); }
    .theme-globular .label-pill { border-color: rgba(167, 139, 250, 0.4); }

    .theme-galaxy .core-dot { background: #67e8f9; box-shadow: 0 0 10px #67e8f9; }
    .theme-galaxy .pulse-ring { border-color: rgba(103, 232, 249, 0.85); }
    .theme-galaxy .label-pill { border-color: rgba(103, 232, 249, 0.4); }

    .theme-stars .core-dot { background: #f8fafc; box-shadow: 0 0 10px #f8fafc; }
    .theme-stars .pulse-ring { border-color: rgba(248, 250, 252, 0.85); }
    .theme-stars .label-pill { border-color: rgba(248, 250, 252, 0.4); }

    @keyframes breathe {
      0%, 100% { transform: scale(0.85); opacity: 0.35; }
      50% { transform: scale(1.35); opacity: 0.95; }
    }

    @keyframes pill-glow {
      0%, 100% { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 255, 255, 0.05); }
      50% { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 22px rgba(255, 255, 255, 0.25); }
    }

    /* VOLET LATÉRAL (DRAWER) CORRIGÉ */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .drawer-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 440px;
      max-width: 90vw;
      height: 100%;
      height: 100dvh;
      background: rgba(11, 17, 33, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: -15px 0 45px rgba(0, 0, 0, 0.85);
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: clamp(1.2rem, 3vh, 2rem) clamp(1.2rem, 3vw, 2.2rem) 3rem;
      display: flex;
      flex-direction: column;
    }

    .drawer.active {
      transform: translateX(0);
    }

    .close-btn {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.25);
      transform: rotate(90deg);
    }

    .drawer-badge {
      display: inline-block;
      align-self: flex-start;
      margin-top: 0.8rem;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: #93c5fd;
      border: 1px solid rgba(147, 197, 253, 0.25);
      flex-shrink: 0;
    }

    .drawer-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.25rem, 2.2vw, 1.55rem);
      letter-spacing: 0.06em;
      color: #ffffff;
      margin-top: 0.6rem;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .drawer-img-container {
      width: 100%;
      height: clamp(160px, 24vh, 220px);
      margin: 1.4rem 0;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      flex-shrink: 0;
    }

    .drawer-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .drawer-desc {
      font-size: 0.92rem;
      line-height: 1.7;
      color: #cbd5e1;
      font-weight: 300;
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
      flex-grow: 1;
    }

    .launch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 0.95rem 1.6rem;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      color: #050814;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
      flex-shrink: 0;
      margin-bottom: 0.8rem;
    }

    .launch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.45);
      background: #ffffff;
      color: #000000;
    }

    .launch-icon {
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .drawer {
        width: 100vw;
        max-width: 100vw;
      }
    }
  </style>
</head>
<body>

  <div class="portal-container" id="portalContainer">
    <img 
      id="spaceBg"
      class="space-canvas" 
      src="https://lh3.googleusercontent.com/d/1jKt4QY5rQ5yBLQEoE2jbIT_jbcM0IZ9S=s2560" 
      alt="Cosmos profond avec Saturne et nébuleuses"
      onerror="this.src='https://drive.google.com/thumbnail?id=1jKt4QY5rQ5yBLQEoE2jbIT_jbcM0IZ9S&sz=w2560';"
    />
    
    <div class="cosmic-overlay"></div>

    <header class="header-bar">
      <h1 class="header-title">Atlas Céleste</h1>
      <span class="header-sub">Portail d'exploration astronomique</span>
    </header>

    <!-- 1. Système Solaire -->
    <div class="hotspot theme-solar" style="top: 78%; left: 24%;" onclick="openPanel('solar')">
      <div class="pulse-anchor">
        <div class="pulse-ring pulse-ring-1"></div>
        <div class="pulse-ring pulse-ring-2"></div>
        <div class="core-dot"></div>
      </div>
      <div class="label-pill">Le monde de notre système solaire</div>
    </div>

    <!-- 2. Nébuleuses -->
    <div class="hotspot theme-nebula" style="top: 28%; left: 19%;" onclick="openPanel('nebula')">
      <div class="pulse-anchor">
        <div class="pulse-ring pulse-ring-1"></div>
        <div class="pulse-ring pulse-ring-2"></div>
        <div class="core-dot"></div>
      </div>
      <div class="label-pill">Le monde des nébuleuses</div>
    </div>

    <!-- 3. Amas Ouverts -->
    <div class="hotspot theme-open reverse" style="top: 21%; left: 47%;" onclick="openPanel('open_cluster')">
      <div class="pulse-anchor">
        <div class="pulse-ring pulse-ring-1"></div>
        <div class="pulse-ring pulse-ring-2"></div>
        <div class="core-dot"></div>
      </div>
      <div class="label-pill">Le monde des amas ouverts</div>
    </div>

    <!-- 4. Amas Globulaires -->
    <div class="hotspot theme-globular reverse" style="top: 45%; left: 66%;" onclick="openPanel('globular_cluster')">
      <div class="pulse-anchor">
        <div class="pulse-ring pulse-ring-1"></div>
        <div class="pulse-ring pulse-ring-2"></div>
        <div class="core-dot"></div>
      </div>
      <div class="label-pill">Le monde des amas globulaires</div>
    </div>

    <!-- 5. Galaxies -->
    <div class="hotspot theme-galaxy reverse" style="top: 15%; left: 77.5%;" onclick="openPanel('galaxy')">
      <div class="pulse-anchor">
        <div class="pulse-ring pulse-ring-1"></div>
        <div class="pulse-ring pulse-ring-2"></div>
        <div class="core-dot"></div>
      </div>
      <div class="label-pill">Le monde des galaxies</div>
    </div>

    <!-- 6. Étoiles -->
    <div class="hotspot theme-stars" style="top: 75%; left: 72%;" onclick="openPanel('stars')">
      <div class="pulse-anchor">
        <div class="pulse-ring pulse-ring-1"></div>
        <div class="pulse-ring pulse-ring-2"></div>
        <div class="core-dot"></div>
      </div>
      <div class="label-pill">Le monde des étoiles</div>
    </div>
  </div>

  <div class="drawer-backdrop" id="backdrop" onclick="closePanel()"></div>

  <!-- Volet latéral interactif -->
  <aside class="drawer" id="drawer">
    <button class="close-btn" onclick="closePanel()" title="Fermer">✕</button>
    <span class="drawer-badge" id="drawerBadge">Exploration</span>
    <h2 class="drawer-title" id="drawerTitle">Titre de l'exploration</h2>

    <div class="drawer-img-container">
      <img id="drawerImage" class="drawer-img" src="" alt="Aperçu Céleste" />
    </div>

    <p class="drawer-desc" id="drawerText">Description introductive...</p>

    <a id="drawerBtn" class="launch-btn" href="#">
      <span>Décollage</span>
      <span class="launch-icon">↗</span>
    </a>
  </aside>

  <script>
    const WORLDS = {
      solar: {
        badge: "Système Planétaire",
        title: "Le Monde de notre Système Solaire",
        image: "https://lh3.googleusercontent.com/d/1e0j2BVS8oQ-6mHr4NAjvxzR3IU0KWurX=s1200",
        fallback: "https://drive.google.com/thumbnail?id=1e0j2BVS8oQ-6mHr4NAjvxzR3IU0KWurX&sz=w1200",
        text: "Des anneaux majestueux de Saturne aux confins de la ceinture de Kuiper, parcourez la diversité géologique et atmosphérique des mondes qui gravitent autour de notre étoile mère.",
        link: "./systeme-solaire/"
      },
      nebula: {
        badge: "Milieu Interstellaire",
        title: "Le Monde des Nébuleuses",
        image: "https://lh3.googleusercontent.com/d/1Zf6RpCGdJEwvDQ1d9sl_L4laCRIexwyL=s1200",
        fallback: "https://drive.google.com/thumbnail?id=1Zf6RpCGdJEwvDQ1d9sl_L4laCRIexwyL&sz=w1200",
        text: "Berceaux d'étoiles et rémanents cataclysmiques de supernovae, les nébuleuses sculptent le vide cosmique de voiles incandescents de gaz ionisé et de poussières sombres.",
        link: "./nebuleuses/"
      },
      open_cluster: {
        badge: "Stellogenèse Récente",
        title: "Le Monde des Amas Ouverts",
        image: "https://lh3.googleusercontent.com/d/1FrBH0aeEt5jIMnkdPifAkOeoEO_HznQB=s1200",
        fallback: "https://drive.google.com/thumbnail?id=1FrBH0aeEt5jIMnkdPifAkOeoEO_HznQB&sz=w1200",
        text: "Congrégations de centaines de jeunes étoiles nées ensemble dans le disque galactique, liées par la gravitation avant de se disperser au gré des révolutions de la Voie Lactée.",
        link: "./amas-ouverts/"
      },
      globular_cluster: {
        badge: "Reliques Cosmiques",
        title: "Le Monde des Amas Globulaires",
        image: "https://lh3.googleusercontent.com/d/1gQv-U4jXmdG7q4MjF56zHYv6hoTisE-c=s1200",
        fallback: "https://drive.google.com/thumbnail?id=1gQv-U4jXmdG7q4MjF56zHYv6hoTisE-c&sz=w1200",
        text: "Sphères denses regroupant jusqu'à un million d'étoiles primitives dans le halo galactique, véritables témoins fossilisés des premiers âges de l'Univers.",
        link: "./amas-globulaires/"
      },
      galaxy: {
        badge: "Échelle Extragalactique",
        title: "Le Monde des Galaxies",
        image: "https://lh3.googleusercontent.com/d/1zvAq7KNyQxvSAB7aH37WYKzYvbZ2hyTN=s1200",
        fallback: "https://drive.google.com/thumbnail?id=1zvAq7KNyQxvSAB7aH37WYKzYvbZ2hyTN&sz=w1200",
        text: "Îlots d'univers rassemblant des centaines de milliards de soleils. Explorez la dynamique des bras spiraux majestueux et l'activité des trous noirs supermassifs centraux.",
        link: "./galaxies/"
      },
      stars: {
        badge: "Spectroscopie Pure",
        title: "Le Monde des Étoiles",
        image: "https://lh3.googleusercontent.com/d/1nFWVD2p3fb8PVfNI79uX1YRFQbcETwfX=s1200",
        fallback: "https://drive.google.com/thumbnail?id=1nFWVD2p3fb8PVfNI79uX1YRFQbcETwfX&sz=w1200",
        text: "Hors de l'atmosphère terrestre, les étoiles brillent d'un éclat pur et immuable, sans la moindre scintillation, révélant la physique intime des réacteurs thermonucléaires.",
        link: "./etoiles/"
      }
    };

    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');
    const drawerImg = document.getElementById('drawerImage');

    function openPanel(key) {
      const data = WORLDS[key];
      if (!data) return;

      document.getElementById('drawerBadge').innerText = data.badge;
      document.getElementById('drawerTitle').innerText = data.title;
      
      drawerImg.onerror = function() {
        this.onerror = null;
        this.src = data.fallback;
      };
      drawerImg.src = data.image;

      document.getElementById('drawerText').innerText = data.text;
      document.getElementById('drawerBtn').href = data.link;

      drawer.classList.add('active');
      backdrop.classList.add('active');
      document.body.classList.add('drawer-open');
    }

    function closePanel() {
      drawer.classList.remove('active');
      backdrop.classList.remove('active');
      document.body.classList.remove('drawer-open');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
    });
  </script>
</body>
</html>
