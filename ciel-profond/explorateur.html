<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorateur du Ciel Profond</title>
  <link rel="stylesheet" href="../fiche.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020617;
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    .engine-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    /* EN-TÊTE */
    .engine-header {
      text-align: center;
      margin-bottom: 2.2rem;
    }
    .engine-header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      letter-spacing: 0.16em;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .engine-header .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      color: #f59e0b;
      text-transform: uppercase;
    }

    /* PANNEAU DE FILTRES */
    .filter-panel {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-bar {
      flex: 1 1 300px;
      background: #070d19;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar:focus {
      border-color: #38bdf8;
    }

    .selectors-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .custom-select {
      background: #070d19;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .custom-select:focus {
      border-color: #38bdf8;
    }

    /* COMPTEURS RÉACTIFS */
    .status-counter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.5rem 0;
      border-top: 1px solid #1e293b;
      font-size: 0.82rem;
      color: #94a3b8;
      flex-wrap: wrap;
      gap: 8px;
    }
    .counter-highlight {
      color: #38bdf8;
      font-weight: 700;
    }

    /* GRILLE DES CARTES */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .object-card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .object-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }
    .card-img-wrap {
      width: 100%;
      height: 180px;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .object-card:hover .card-img-wrap img {
      transform: scale(1.05);
    }
    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-nebuleuse { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }
    .badge-galaxie { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-amas { background: rgba(167, 139, 250, 0.15); color: #c084fc; border: 1px solid rgba(167, 139, 250, 0.4); }
    .badge-etoile { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
    .badge-constellation { background: rgba(250, 204, 21, 0.12); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.35); }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 700;
    }
    .card-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* POP-UP MODAL (100% NATIF EN DIV, AUCUNE IFRAME) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-container {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      padding: 2.2rem;
    }
    .modal-container::-webkit-scrollbar {
      width: 6px;
    }
    .modal-container::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .modal-hero-img-box {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1e293b;
      background: #000;
      margin: 1.5rem 0;
    }
    .modal-hero-img-box img {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .modal-caption {
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #94a3b8;
      background: #070d19;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-style: italic;
    }

    .modal-header-titles h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .modal-header-titles .modal-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: #f59e0b;
      margin-bottom: 12px;
    }

    .coords-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.82rem;
    }
    .coords-table td {
      padding: 6px 10px;
      border: 1px solid #1e293b;
      background: #070d19;
    }
    .coords-table td strong {
      color: #38bdf8;
    }

    .modal-text {
      font-size: 0.95rem;
      line-height: 1.85;
      color: #cbd5e1;
      text-align: justify;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <div class="engine-wrapper">
    <header class="engine-header">
      <h1>Explorateur Céleste</h1>
      <div class="subtitle">Catalogue Dynamique du Ciel Profond</div>
    </header>

    <!-- FORMULAIRE DE FILTRAGE MULTI-CRITÈRES -->
    <div class="filter-panel">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher par nom, alias, catalogue (ex. Messier 1, Crabe, NGC 1952)...">
      </div>

      <div class="selectors-row">
        <select id="filterCategory" class="custom-select">
          <option value="all">Toutes les catégories</option>
          <option value="galaxie">Galaxies</option>
          <option value="nebuleuse">Nébuleuses</option>
          <option value="amas_ouvert">Amas Ouverts</option>
          <option value="amas_globulaire">Amas Globulaires</option>
          <option value="etoile">Étoiles remarquables</option>
        </select>

        <select id="filterSubCategory" class="custom-select" disabled>
          <option value="all">Tous les sous-types</option>
        </select>

        <select id="filterConstellation" class="custom-select">
          <option value="all">Toutes les constellations</option>
        </select>
      </div>

      <div class="status-counter-bar">
        <div>Objets filtrés : <span id="filteredCount" class="counter-highlight">0</span></div>
        <div>Total dans le catalogue : <span id="totalCount" class="counter-highlight">0</span></div>
      </div>
    </div>

    <!-- GRILLE DES OBJETS -->
    <div class="gallery-grid" id="galleryContainer"></div>
  </div>

  <!-- POP-UP MODAL POUR LA FICHE -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
    <div class="modal-container">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      
      <div class="modal-header-titles">
        <h2 id="mNomPrincipal">Nom</h2>
        <div class="modal-sub" id="mAutreNom">Autre nom</div>
        <div class="card-badges" id="mBadges"></div>
      </div>

      <div class="modal-hero-img-box">
        <img id="mImage" src="" alt="">
        <div class="modal-caption" id="mLegendeImage"></div>
      </div>

      <table class="coords-table">
        <tr>
          <td><strong>Catalogues :</strong> <span id="mCatalogues">-</span></td>
          <td><strong>Constellation :</strong> <span id="mConstellation">-</span></td>
        </tr>
        <tr>
          <td><strong>Distance :</strong> <span id="mDistance">-</span></td>
          <td><strong>Magnitude apparente :</strong> <span id="mMagnitude">-</span></td>
        </tr>
        <tr>
          <td><strong>Ascension Droite :</strong> <span id="mAD">-</span></td>
          <td><strong>Déclinaison :</strong> <span id="mDec">-</span></td>
        </tr>
      </table>

      <div class="modal-text" id="mTexte"></div>
    </div>
  </div>

  <!-- CHARGEMENT DU FICHIER DATA SÉPARÉ -->
  <script src="./data/data-objets.js"></script>

  <script>
    const SUB_CATEGORIES = {
      galaxie: [
        { val: "spirale", label: "Galaxie spirale" },
        { val: "spirale_barree", label: "Galaxie spirale barrée" },
        { val: "elliptique", label: "Galaxie elliptique" },
        { val: "lenticulaire", label: "Galaxie lenticulaire" },
        { val: "irreguliere", label: "Galaxie irrégulière" },
        { val: "interaction", label: "En interaction / Fusion" }
      ],
      nebuleuse: [
        { val: "reste_supernova", label: "Reste de supernova" },
        { val: "emission", label: "Nébuleuse en émission" },
        { val: "planetaire", label: "Nébuleuse planétaire" },
        { val: "obscure", label: "Nébuleuse obscure" },
        { val: "reflexion", label: "Nébuleuse par réflexion" }
      ],
      amas_ouvert: [
        { val: "amas_jeune", label: "Amas jeune avec nébulosité" },
        { val: "amas_dissocie", label: "Amas dissocié" }
      ],
      amas_globulaire: [
        { val: "concentre", label: "Forte concentration centrale" },
        { val: "diffus", label: "Faible concentration" }
      ],
      etoile: [
        { val: "variable", label: "Étoile variable" },
        { val: "binaire", label: "Système binaire / multiple" },
        { val: "supergeante", label: "Supergéante" }
      ]
    };

    let dataset = (typeof OBJETS_CIEL_PROFOND !== 'undefined') ? OBJETS_CIEL_PROFOND : [];

    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const filterSubCategory = document.getElementById('filterSubCategory');
    const filterConstellation = document.getElementById('filterConstellation');
    const galleryContainer = document.getElementById('galleryContainer');
    const filteredCount = document.getElementById('filteredCount');
    const totalCount = document.getElementById('totalCount');

    function populateConstellations() {
      const constellations = [...new Set(dataset.map(item => item.constellation))].filter(Boolean).sort();
      constellations.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        filterConstellation.appendChild(opt);
      });
    }

    function updateSubCategoryDropdown() {
      const cat = filterCategory.value;
      filterSubCategory.innerHTML = '<option value="all">Tous les sous-types</option>';
      if (cat !== 'all' && SUB_CATEGORIES[cat]) {
        SUB_CATEGORIES[cat].forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub.val;
          opt.textContent = sub.label;
          filterSubCategory.appendChild(opt);
        });
        filterSubCategory.disabled = false;
      } else {
        filterSubCategory.disabled = true;
      }
    }

    function getBadgeClass(cat) {
      if (cat.includes('galaxie')) return 'badge-galaxie';
      if (cat.includes('nebuleuse')) return 'badge-nebuleuse';
      if (cat.includes('amas')) return 'badge-amas';
      if (cat.includes('etoile')) return 'badge-etoile';
      return 'badge-nebuleuse';
    }

    function renderGallery() {
      const q = searchInput.value.toLowerCase().trim();
      const cat = filterCategory.value;
      const sub = filterSubCategory.value;
      const constel = filterConstellation.value;

      const filtered = dataset.filter(item => {
        const matchSearch = item.nomPrincipal.toLowerCase().includes(q) ||
                            (item.autreNom && item.autreNom.toLowerCase().includes(q)) ||
                            (item.catalogues && item.catalogues.some(c => c.toLowerCase().includes(q)));
        const matchCat = (cat === 'all' || item.categoriePrincipale === cat);
        const matchSub = (sub === 'all' || item.sousCategorie === sub);
        const matchConstel = (constel === 'all' || item.constellation === constel);

        return matchSearch && matchCat && matchSub && matchConstel;
      });

      galleryContainer.innerHTML = '';
      filteredCount.textContent = filtered.length;
      totalCount.textContent = dataset.length;

      if (filtered.length === 0) {
        galleryContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Aucun objet ne correspond aux critères de sélection.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'object-card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${item.image}" alt="${item.nomPrincipal}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-badges">
              <span class="badge ${getBadgeClass(item.categoriePrincipale)}">${item.categoriePrincipale.replace('_', ' ')}</span>
              ${item.constellation ? `<span class="badge badge-constellation">${item.constellation}</span>` : ''}
            </div>
            <div class="card-title">${item.nomPrincipal}</div>
            <div class="card-subtitle">${item.autreNom || (item.catalogues ? item.catalogues.join(', ') : '')}</div>
          </div>
        `;
        galleryContainer.appendChild(card);
      });
    }

    function openModal(item) {
      document.getElementById('mNomPrincipal').textContent = item.nomPrincipal;
      document.getElementById('mAutreNom').textContent = item.autreNom || '';
      document.getElementById('mImage').src = item.image;
      document.getElementById('mLegendeImage').textContent = item.legendeImage || item.nomPrincipal;
      document.getElementById('mCatalogues').textContent = item.catalogues ? item.catalogues.join(', ') : '-';
      document.getElementById('mConstellation').textContent = item.constellation || '-';
      
      const c = item.coordonnees || {};
      document.getElementById('mDistance').textContent = c.distance || '-';
      document.getElementById('mMagnitude').textContent = c.magnitude || '-';
      document.getElementById('mAD').textContent = c.ad || '-';
      document.getElementById('mDec').textContent = c.dec || '-';

      document.getElementById('mBadges').innerHTML = `
        <span class="badge ${getBadgeClass(item.categoriePrincipale)}">${item.categoriePrincipale.replace('_', ' ')}</span>
        ${item.sousCategorie ? `<span class="badge" style="background:#1e293b; color:#94a3b8; border:1px solid #334155;">${item.sousCategorie.replace('_', ' ')}</span>` : ''}
      `;

      document.getElementById('mTexte').innerHTML = `<p>${item.texte}</p>`;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    searchInput.addEventListener('input', renderGallery);
    filterCategory.addEventListener('change', () => {
      updateSubCategoryDropdown();
      renderGallery();
    });
    filterSubCategory.addEventListener('change', renderGallery);
    filterConstellation.addEventListener('change', renderGallery);

    populateConstellations();
    updateSubCategoryDropdown();
    renderGallery();
  </script>
</body>
</html>
