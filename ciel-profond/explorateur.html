<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorateur du Ciel Profond</title>
  <link rel="stylesheet" href="../fiche.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020617;
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    .engine-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    /* EN-TÊTE */
    .engine-header {
      text-align: center;
      margin-bottom: 2.2rem;
    }
    .engine-header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      letter-spacing: 0.16em;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .engine-header .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      color: #f59e0b;
      text-transform: uppercase;
    }
    /* GRAND COMPTEUR D'OBJETS SOMMITAL */
    .total-counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(56, 189, 248, 0.1);
      backdrop-filter: blur(8px);
    }
    .total-counter-icon {
      width: 18px;
      height: 18px;
      stroke: #38bdf8;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px #38bdf8);
    }
    .total-counter-number {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .total-counter-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #94a3b8;
    }

    /* PANNEAU DE FILTRES */
    .filter-panel {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-bar {
      flex: 1 1 300px;
      background: #070d19;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar:focus {
      border-color: #38bdf8;
    }

    .selectors-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .custom-select {
      background: #070d19;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .custom-select:focus {
      border-color: #38bdf8;
    }

    /* COMPTEURS RÉACTIFS */
    .status-counter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.5rem 0;
      border-top: 1px solid #1e293b;
      font-size: 0.82rem;
      color: #94a3b8;
      flex-wrap: wrap;
      gap: 8px;
    }
    .counter-highlight {
      color: #38bdf8;
      font-weight: 700;
    }

    /* GRILLE DES CARTES */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .object-card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .object-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }
    .card-img-wrap {
      width: 100%;
      height: 180px;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .object-card:hover .card-img-wrap img {
      transform: scale(1.05);
    }
    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-nebuleuse { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }
    .badge-galaxie { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-amas { background: rgba(167, 139, 250, 0.15); color: #c084fc; border: 1px solid rgba(167, 139, 250, 0.4); }
    .badge-etoile { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
    .badge-constellation { background: rgba(250, 204, 21, 0.12); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.35); }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 700;
    }
    .card-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* POP-UP MODAL (100% NATIF EN DIV, AUCUNE IFRAME) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-container {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 16px;
      max-width: 1180px;
      width: 95vw;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      padding: 2.2rem 2.8rem;
    }

    /* Flèches de navigation circulaire */
    .modal-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: all 0.25s ease;
      z-index: 10;
      backdrop-filter: blur(6px);
      user-select: none;
    }
    .modal-nav-btn:hover {
      background: #38bdf8;
      color: #020617;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      border-color: #38bdf8;
    }
    .modal-nav-prev { left: 14px; }
    .modal-nav-next { right: 14px; }

    @media (max-width: 768px) {
      .modal-container { padding: 1.5rem 1rem; }
      .modal-nav-btn { top: auto; bottom: 14px; transform: none; width: 38px; height: 38px; }
      .modal-nav-prev { left: 20px; }
      .modal-nav-next { right: 20px; }
    }
    .modal-container::-webkit-scrollbar {
      width: 6px;
    }
    .modal-container::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .modal-hero-img-box {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1e293b;
      background: #000;
      margin: 1.5rem 0;
      position: relative;
    }
    .modal-hero-img-box img {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      background: #000;
      cursor: zoom-in;
      transition: filter 0.2s ease;
    }
    .modal-hero-img-box img:hover {
      filter: brightness(1.08);
    }
    .modal-hero-img-box img.crop-vertically {
      object-fit: cover;
      object-position: center 50%;
      transform: scale(1.18);
    }
    .modal-caption {
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #94a3b8;
      background: #070d19;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-style: italic;
    }

    /* Pastille d'invitation au zoom */
    .zoom-hint-btn {
      position: absolute;
      bottom: 42px;
      right: 14px;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .zoom-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulseDot 1.8s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* VISIONNEUSE MAXIMALE PLEIN ÉCRAN */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      padding: 1.5vh 1.5vw;
    }
    .lightbox-overlay.active {
      display: flex;
    }
    .lightbox-img {
      max-width: 97vw;
      max-height: 94vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .modal-header-titles h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .modal-header-titles .modal-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: #f59e0b;
      margin-bottom: 12px;
    }

    .coords-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.82rem;
    }
    .coords-table td {
      padding: 6px 10px;
      border: 1px solid #1e293b;
      background: #070d19;
    }
    .coords-table td strong {
      color: #38bdf8;
    }

    .modal-text {
      font-size: 0.95rem;
      line-height: 1.85;
      color: #cbd5e1;
      text-align: justify;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <div class="engine-wrapper">
    <header class="engine-header">
      <h1>Explorateur Céleste</h1>
      <div class="subtitle">Catalogue Dynamique du Ciel Profond</div>
      
      <!-- GRAND COMPTEUR SOMMITAL AVEC ICÔNE COMPTEUR -->
      <div class="total-counter-badge">
        <svg class="total-counter-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 3"></path>
          <path d="M7 12h1"></path>
          <path d="M16 12h1"></path>
        </svg>
        <span id="grandTotalCount" class="total-counter-number">0</span>
        <span class="total-counter-label">Objets répertoriés</span>
      </div>
    </header>

    <!-- FORMULAIRE DE FILTRAGE MULTI-CRITÈRES -->
    <div class="filter-panel">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher par nom, alias, catalogue (ex. Messier 1, Crabe, NGC 1952)...">
      </div>

     <div class="selectors-row">
        <!-- 1. Catégorie principale -->
        <select id="filterCategory" class="custom-select">
          <option value="all">Toutes les catégories</option>
          <option value="galaxie">Galaxies</option>
          <option value="nebuleuse">Nébuleuses</option>
          <option value="amas_ouvert">Amas Ouverts</option>
          <option value="amas_globulaire">Amas Globulaires</option>
          <option value="etoile">Étoiles remarquables</option>
        </select>

        <!-- 2. Morphologie / Type -->
        <select id="filterSubCategory" class="custom-select" disabled>
          <option value="all">Tous les types morphologiques</option>
        </select>

        <!-- 3. Spécificités remarquables (Starburst, Seyfert, Grand Dessein...) -->
        <select id="filterSpecialite" class="custom-select">
          <option value="all">Toutes spécificités</option>
          <option value="grand_dessein">Grand Dessein</option>
          <option value="starburst">Starburst (Flambée d'étoiles)</option>
          <option value="seyfert">Noyau actif / Seyfert</option>
          <option value="remanent">Rémanent / Pulsar actif</option>
        </select>

        <!-- 4. Constellation -->
        <select id="filterConstellation" class="custom-select">
          <option value="all">Toutes les constellations</option>
        </select>

        <!-- 5. Option de tri -->
        <select id="filterSort" class="custom-select">
          <option value="recent">Tri : Derniers ajouts</option>
          <option value="alpha_asc">Nom (A → Z)</option>
          <option value="alpha_desc">Nom (Z → A)</option>
        </select>
      </div>

      <div class="status-counter-bar">
        <div>Objets filtrés : <span id="filteredCount" class="counter-highlight">0</span></div>
        <div>Total dans le catalogue : <span id="totalCount" class="counter-highlight">0</span></div>
      </div>
    </div>

    <!-- GRILLE DES OBJETS -->
    <div class="gallery-grid" id="galleryContainer"></div>

    <!-- BOUTON CHARGEMENT PROGRESSIF -->
    <div id="loadMoreWrap" style="text-align: center; margin-top: 2rem; display: none;">
      <button id="loadMoreBtn" style="background: #0b1120; border: 1px solid #38bdf8; color: #38bdf8; padding: 10px 24px; border-radius: 20px; font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.15em; cursor: pointer; transition: all 0.2s;">
        Afficher plus d'objets
      </button>
    </div>
  </div>

  <!-- POP-UP MODAL POUR LA FICHE -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
    <div class="modal-container">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      
      <!-- Boutons Flèches Précédent / Suivant -->
      <button class="modal-nav-btn modal-nav-prev" onclick="naviguerModal(-1)" title="Objet précédent (Flèche Gauche)">‹</button>
      <button class="modal-nav-btn modal-nav-next" onclick="naviguerModal(1)" title="Objet suivant (Flèche Droite)">›</button>

      <div class="modal-header-titles">
        <h2 id="mNomPrincipal">Nom</h2>
        <div class="modal-sub" id="mAutreNom">Autre nom</div>
        <div class="card-badges" id="mBadges"></div>
      </div>

      <div class="modal-hero-img-box" onclick="ouvrirPleinEcranImage(event)">
        <img id="mImage" src="" alt="" title="Cliquer pour admirer en grand format">
        <div class="zoom-hint-btn">
          <span class="zoom-pulse-dot"></span>
          <span>Agrandir ⤢</span>
        </div>
        <div class="modal-caption" id="mLegendeImage"></div>
      </div>

      <table class="coords-table">
        <tr>
          <td><strong>Catalogues :</strong> <span id="mCatalogues">-</span></td>
          <td><strong>Constellation :</strong> <span id="mConstellation">-</span></td>
        </tr>
        <tr>
          <td><strong>Distance :</strong> <span id="mDistance">-</span></td>
          <td><strong>Magnitude apparente :</strong> <span id="mMagnitude">-</span></td>
        </tr>
        <tr>
          <td><strong>Ascension Droite :</strong> <span id="mAD">-</span></td>
          <td><strong>Déclinaison :</strong> <span id="mDec">-</span></td>
        </tr>
        <tr>
          <td colspan="2"><strong>Vitesse radiale :</strong> <span id="mVitesseRadiale">-</span></td>
        </tr>
      </table>

      <div class="modal-text" id="mTexte"></div>
    </div>
  </div>
  <!-- VISIONNEUSE PLEIN ÉCRAN POUR L'IMAGE -->
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="fermerPleinEcranImage()" title="Cliquer pour revenir à la fiche">
    <img id="lightboxImg" class="lightbox-img" src="" alt="">
  </div>

  <!-- CHARGEMENT DU FICHIER DATA SÉPARÉ -->
  <script src="./data/data-objets.js"></script>

 <script>
    const SUB_CATEGORIES = {
      galaxie: [
        { val: "spirale", label: "Galaxie spirale" },
        { val: "elliptique", label: "Galaxie elliptique" },
        { val: "lenticulaire", label: "Galaxie lenticulaire" },
        { val: "irreguliere", label: "Galaxie irrégulière" },
        { val: "interaction", label: "En interaction / Fusion" },
        { val: "amas_groupe", label: "Amas / Groupe de galaxies" }
      ],
      nebuleuse: [
        { val: "reste_supernova", label: "Reste de supernova" },
        { val: "emission", label: "Nébuleuse en émission" },
        { val: "planetaire", label: "Nébuleuse planétaire" },
        { val: "obscure", label: "Nébuleuse obscure" },
        { val: "reflexion", label: "Nébuleuse par réflexion" }
      ],
      amas_ouvert: [
        { val: "amas_jeune", label: "Amas jeune avec nébulosité" },
        { val: "amas_dissocie", label: "Amas dissocié" }
      ],
      amas_globulaire: [
        { val: "concentre", label: "Forte concentration centrale" },
        { val: "diffus", label: "Faible concentration" }
      ],
      etoile: [
        { val: "variable", label: "Étoile variable" },
        { val: "binaire", label: "Système binaire / multiple" },
        { val: "supergeante", label: "Supergéante" }
      ]
    };

    let dataset = (typeof OBJETS_CIEL_PROFOND !== 'undefined') ? OBJETS_CIEL_PROFOND : [];

    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const filterSubCategory = document.getElementById('filterSubCategory');
    const filterSpecialite = document.getElementById('filterSpecialite');
    const filterConstellation = document.getElementById('filterConstellation');
    const filterSort = document.getElementById('filterSort');
    const galleryContainer = document.getElementById('galleryContainer');
    const filteredCount = document.getElementById('filteredCount');
    const totalCount = document.getElementById('totalCount');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    const ITEMS_PER_PAGE = 48;
    let visibleLimit = ITEMS_PER_PAGE;
    let currentFiltered = [];
    let currentModalIndex = -1;

    function populateConstellations() {
      const constellations = [...new Set(dataset.map(item => item.constellation))].filter(Boolean).sort();
      filterConstellation.innerHTML = '<option value="all">Toutes les constellations</option>';
      constellations.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        filterConstellation.appendChild(opt);
      });
    }

    function updateSubCategoryDropdown() {
      const cat = filterCategory.value;
      filterSubCategory.innerHTML = '<option value="all">Tous les types morphologiques</option>';
      
      if (cat !== 'all' && SUB_CATEGORIES[cat]) {
        SUB_CATEGORIES[cat].forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub.val;
          opt.textContent = sub.label;
          filterSubCategory.appendChild(opt);
        });
        filterSubCategory.disabled = false;
      } else {
        filterSubCategory.disabled = true;
      }

      // Grise le filtre spécificités si la catégorie n'est pas "galaxie"
      if (cat === 'galaxie' || cat === 'all') {
        filterSpecialite.disabled = false;
      } else {
        filterSpecialite.value = 'all';
        filterSpecialite.disabled = true;
      }
    }

    function getBadgeClass(cat) {
      if (cat.includes('galaxie')) return 'badge-galaxie';
      if (cat.includes('nebuleuse')) return 'badge-nebuleuse';
      if (cat.includes('amas')) return 'badge-amas';
      if (cat.includes('etoile')) return 'badge-etoile';
      return 'badge-nebuleuse';
    }

    function renderGallery(resetLimit = true) {
      if (resetLimit) visibleLimit = ITEMS_PER_PAGE;

      const q = searchInput.value.toLowerCase().trim();
      const cat = filterCategory.value;
      const sub = filterSubCategory.value;
      const spec = filterSpecialite.value;
      const constel = filterConstellation.value;
      const sortMode = filterSort.value;

      // 1. Détermination de la liste de base selon l'ordre chronologique
      // On clone le tableau avec slice() pour ne pas altérer le jeu de données d'origine
      let baseList = dataset.slice();
      if (sortMode === 'recent') {
        baseList.reverse(); // Le dernier objet saisi dans data-objets.js se place en tête de liste
      } else if (sortMode === 'alpha_asc') {
        baseList.sort((a, b) => a.nomPrincipal.localeCompare(b.nomPrincipal, 'fr', { numeric: true }));
      } else if (sortMode === 'alpha_desc') {
        baseList.sort((a, b) => b.nomPrincipal.localeCompare(a.nomPrincipal, 'fr', { numeric: true }));
      }

      // 2. Application des filtres
      currentFiltered = baseList.filter(item => {
        const matchSearch = item.nomPrincipal.toLowerCase().includes(q) ||
                            (item.autreNom && item.autreNom.toLowerCase().includes(q)) ||
                            (item.catalogues && item.catalogues.some(c => c.toLowerCase().includes(q)));
        
        const matchCat = (cat === 'all' || item.categoriePrincipale === cat);
        const matchSub = (sub === 'all' || item.sousCategorie === sub);
        
        let matchSpec = true;
        if (spec !== 'all') {
          matchSpec = Array.isArray(item.specificites) ? item.specificites.includes(spec) : (item.specificites === spec);
        }

        const matchConstel = (constel === 'all' || item.constellation === constel);
        return matchSearch && matchCat && matchSub && matchSpec && matchConstel;
      });

      // 3. Mise à jour des compteurs (le grand en haut + les barres secondaires)
      filteredCount.textContent = currentFiltered.length;
      totalCount.textContent = dataset.length;
      const grandTotalEl = document.getElementById('grandTotalCount');
      if (grandTotalEl) grandTotalEl.textContent = dataset.length;

      const toDisplay = currentFiltered.slice(0, visibleLimit);
      galleryContainer.innerHTML = '';

      if (toDisplay.length === 0) {
        galleryContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Aucun objet ne correspond aux critères de sélection.</div>';
        loadMoreWrap.style.display = 'none';
        return;
      }

      toDisplay.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'object-card';
        card.onclick = () => openModalByIndex(index);

        let specBadges = '';
        if (item.specificites && Array.isArray(item.specificites)) {
          specBadges = item.specificites.map(s => `<span class="badge" style="background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.35);">${s.replace('_', ' ')}</span>`).join('');
        }

        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${item.image}" alt="${item.nomPrincipal}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-badges">
              <span class="badge ${getBadgeClass(item.categoriePrincipale)}">${item.categoriePrincipale.replace('_', ' ')}</span>
              ${specBadges}
              ${item.constellation ? `<span class="badge badge-constellation">${item.constellation}</span>` : ''}
            </div>
            <div class="card-title">${item.nomPrincipal}</div>
            <div class="card-subtitle">${item.autreNom || (item.catalogues ? item.catalogues.join(', ') : '')}</div>
          </div>
        `;
        galleryContainer.appendChild(card);
      });

      if (visibleLimit < currentFiltered.length) {
        loadMoreWrap.style.display = 'block';
        loadMoreBtn.textContent = `Afficher plus (${visibleLimit} / ${currentFiltered.length})`;
      } else {
        loadMoreWrap.style.display = 'none';
      }
    }

    function openModalByIndex(index) {
      if (index < 0 || index >= currentFiltered.length) return;
      currentModalIndex = index;
      const item = currentFiltered[index];

      document.getElementById('mNomPrincipal').textContent = item.nomPrincipal;
      document.getElementById('mAutreNom').textContent = item.autreNom || '';
      
      const modalImg = document.getElementById('mImage');
      modalImg.src = item.image;
      if (item.rognerVertical) {
        modalImg.classList.add('crop-vertically');
      } else {
        modalImg.classList.remove('crop-vertically');
      }

      document.getElementById('mLegendeImage').textContent = item.legendeImage || item.nomPrincipal;
      document.getElementById('mCatalogues').textContent = item.catalogues ? item.catalogues.join(', ') : '-';
      document.getElementById('mConstellation').textContent = item.constellation || '-';
      
      const c = item.coordonnees || {};
      document.getElementById('mDistance').textContent = c.distance || '-';
      document.getElementById('mMagnitude').textContent = c.magnitude || '-';
      document.getElementById('mAD').textContent = c.ad || '-';
      document.getElementById('mDec').textContent = c.dec || '-';
      
      const elVit = document.getElementById('mVitesseRadiale');
      if (elVit) {
        elVit.textContent = c.vitesseRadiale || 'Non déterminée / Négligeable';
      }

      let badgesHtml = `<span class="badge ${getBadgeClass(item.categoriePrincipale)}">${item.categoriePrincipale.replace('_', ' ')}</span>`;
      if (item.sousCategorie) {
        badgesHtml += `<span class="badge" style="background:#1e293b; color:#94a3b8; border:1px solid #334155;">${item.sousCategorie.replace('_', ' ')}</span>`;
      }
      if (item.specificites && Array.isArray(item.specificites)) {
        item.specificites.forEach(s => {
          badgesHtml += `<span class="badge" style="background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.35);">${s.replace('_', ' ')}</span>`;
        });
      }
      document.getElementById('mBadges').innerHTML = badgesHtml;

      document.getElementById('mTexte').innerHTML = `<p>${item.texte}</p>`;
      
      const btnPrev = document.querySelector('.modal-nav-prev');
      const btnNext = document.querySelector('.modal-nav-next');
      if (btnPrev) btnPrev.style.display = (index > 0) ? 'flex' : 'none';
      if (btnNext) btnNext.style.display = (index < currentFiltered.length - 1) ? 'flex' : 'none';

      document.getElementById('modalOverlay').classList.add('active');
    }

    function naviguerModal(direction) {
      const nouveauIndex = currentModalIndex + direction;
      if (nouveauIndex >= 0 && nouveauIndex < currentFiltered.length) {
        openModalByIndex(nouveauIndex);
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      currentModalIndex = -1;
    }
   function ouvrirPleinEcranImage(e) {
      if (e) e.stopPropagation();
      const src = document.getElementById('mImage').src;
      if (!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxOverlay').classList.add('active');
    }

    function fermerPleinEcranImage() {
      document.getElementById('lightboxOverlay').classList.remove('active');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    window.addEventListener('keydown', (e) => {
      const lb = document.getElementById('lightboxOverlay');
      if (lb && lb.classList.contains('active')) {
        if (e.key === 'Escape') fermerPleinEcranImage();
        return;
      }

      const modal = document.getElementById('modalOverlay');
      if (modal && modal.classList.contains('active')) {
        if (e.key === 'ArrowLeft') naviguerModal(-1);
        if (e.key === 'ArrowRight') naviguerModal(1);
        if (e.key === 'Escape') closeModal();
      }
    });

    loadMoreBtn.addEventListener('click', () => {
      visibleLimit += ITEMS_PER_PAGE;
      renderGallery(false);
    });

    searchInput.addEventListener('input', () => renderGallery(true));
    filterCategory.addEventListener('change', () => {
      updateSubCategoryDropdown();
      renderGallery(true);
    });
    filterSubCategory.addEventListener('change', () => renderGallery(true));
    filterSpecialite.addEventListener('change', () => renderGallery(true));
    filterConstellation.addEventListener('change', () => renderGallery(true));
    filterSort.addEventListener('change', () => renderGallery(true));

    populateConstellations();
    updateSubCategoryDropdown();
    renderGallery(true);
  </script>
</body>
</html>
